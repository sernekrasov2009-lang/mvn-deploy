name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint + unit tests
        run: bash tests/lint.sh

  # Dry run on many distributions: checks OS detection, package manager, firewall backend
  # and the whole plan without needing systemd inside the container.
  dry-run:
    name: Dry run on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:11",                   pm: apt,    family: debian }
          - { image: "debian:12",                   pm: apt,    family: debian }
          - { image: "debian:13",                   pm: apt,    family: debian }
          - { image: "ubuntu:20.04",                pm: apt,    family: debian }
          - { image: "ubuntu:22.04",                pm: apt,    family: debian }
          - { image: "ubuntu:24.04",                pm: apt,    family: debian }
          - { image: "almalinux:8",                 pm: dnf,    family: rhel }
          - { image: "almalinux:9",                 pm: dnf,    family: rhel }
          - { image: "rockylinux:9",                pm: dnf,    family: rhel }
          - { image: "oraclelinux:9",               pm: dnf,    family: rhel }
          - { image: "fedora:latest",               pm: dnf,    family: rhel }
          - { image: "amazonlinux:2023",            pm: dnf,    family: rhel }
          - { image: "quay.io/centos/centos:stream9", pm: dnf,  family: rhel }
          - { image: "archlinux:latest",            pm: pacman, family: arch }
          - { image: "opensuse/leap:15.6",          pm: zypper, family: suse }
          - { image: "opensuse/tumbleweed:latest",  pm: zypper, family: suse }
          - { image: "alpine:3.20",                 pm: apk,    family: alpine }
    steps:
      - name: Install base tools (this is the test machine, not the project)
        shell: sh
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates tar gzip bash openssl iproute2 procps kmod
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q --allowerasing curl tar gzip bash openssl iproute procps-ng kmod findutils
          elif command -v yum >/dev/null 2>&1; then
            yum install -y -q curl tar gzip bash openssl iproute procps-ng kmod findutils
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm curl tar gzip bash openssl iproute2 procps-ng kmod
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install --no-recommends curl tar gzip bash openssl iproute2 procps kmod
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash curl tar gzip openssl iproute2 procps-ng kmod
          fi
      - name: Fetch the project at this commit
        shell: bash
        run: |
          curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" | tar xz
          mv mvn-deploy-* project
      - name: Dry run
        shell: bash
        working-directory: project
        env:
          MVN_ALLOW_NO_INIT: "1"
          MVN_SSH_PORTS: "22"
        run: |
          set -o pipefail
          bash install.sh --dry-run -y --ssl selfsigned 2>&1 | tee ../dry-run.txt
          grep -q "family ${{ matrix.family }}, packages via ${{ matrix.pm }}" ../dry-run.txt
          grep -q "Dry run finished" ../dry-run.txt

  # A real installation on clean Ubuntu machines: 3x-ui, firewall, fail2ban, BBR, HTTPS.
  e2e:
    name: Real install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Make the runner look like a clean VPS (no Docker firewall rules)
        run: |
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo iptables -P INPUT ACCEPT; sudo iptables -P FORWARD ACCEPT; sudo iptables -P OUTPUT ACCEPT
          sudo iptables -t nat -F; sudo iptables -t mangle -F; sudo iptables -F; sudo iptables -X
          sudo ip6tables -P INPUT ACCEPT 2>/dev/null || true; sudo ip6tables -F 2>/dev/null || true
          command -v nft >/dev/null && sudo nft flush ruleset || true
      - name: Install (unattended, self-signed HTTPS, custom panel port)
        run: |
          sudo env MVN_SSH_PORTS=22 MVN_EXTRA_TCP_PORTS=443 bash install.sh -y --ssl selfsigned --panel-port 48217
      - name: Verify the result
        run: |
          sudo systemctl is-active x-ui
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:48217/ || true)"
          echo "panel HTTPS status: ${code}"; test "${code}" != "000"
          sudo ufw status | tee /dev/stderr | grep -E "48217/tcp +ALLOW"
          sudo ufw status | grep -E "443/tcp +ALLOW"
          sudo fail2ban-client status sshd
          sysctl net.ipv4.tcp_congestion_control
      - name: Run again (must be idempotent)
        run: sudo env MVN_SSH_PORTS=22 bash install.sh -y --ssl selfsigned
      - name: Uninstall
        run: sudo bash uninstall.sh -y
