# shellcheck shell=bash
# MVN Deploy — default settings. Trusted Bash code: shipped inside a verified release.
# Every MVN_* value can be overridden by an environment variable or by
# /etc/mvn-deploy/mvn-deploy.conf (plain KEY=VALUE lines, parsed, never sourced).

PROJECT_NAME="MVN Deploy"
MVN_VERSION="0.1.0-dev"

# Supported platforms (target matrix; final list is fixed by real VPS tests).
SUPPORTED_OS=("debian:12" "debian:13" "ubuntu:22.04" "ubuntu:24.04")
SUPPORTED_ARCH=("amd64" "arm64")

MIN_FREE_MB=500
MIN_YEAR=2025

# Paths
: "${MVN_LOG_FILE:=/var/log/mvn-deploy/install.log}"
: "${MVN_STATE_DIR:=/var/lib/mvn-deploy}"
: "${MVN_INSTALL_DIR:=/opt/mvn-deploy}"
: "${MVN_LOCK_FILE:=/run/lock/mvn-deploy.lock}"
: "${MVN_BACKUP_DIR:=/var/backups/mvn-deploy}"
XUI_FOLDER="${XUI_MAIN_FOLDER:-/usr/local/x-ui}"
XUI_RESULT_FILE="/etc/x-ui/install-result.env"

# Behaviour
: "${MVN_NONINTERACTIVE:=0}"
: "${MVN_DRY_RUN:=0}"
: "${MVN_ALLOW_CONFLICTS:=0}"
: "${MVN_APT_UPGRADE:=0}"
: "${MVN_SKIP_NETWORK_CHECK:=0}"

# 3x-ui (installed ONLY through its official installer)
: "${MVN_XUI_VERSION:=}"                # empty = latest stable; or a tag like v3.7.0
: "${MVN_XUI_INSTALLER_REF:=master}"    # ref of MHSanaei/3x-ui used for install.sh
: "${MVN_XUI_INSTALLER_SHA256:=}"       # optional pin of the installer script
: "${MVN_XUI_SSL_MODE:=none}"           # none | ip | domain (passed to the installer)
: "${MVN_XUI_DOMAIN:=}"
: "${MVN_FORCE_XUI_REINSTALL:=0}"

# Firewall (UFW only; foreign firewalls are never touched)
: "${MVN_FIREWALL:=auto}"               # auto | skip
: "${MVN_SSH_PORTS:=}"                  # extra SSH ports to allow (added to auto-detected)
: "${MVN_EXTRA_TCP_PORTS:=}"            # e.g. "443" or "443,8443" or "10000:10100"
: "${MVN_EXTRA_UDP_PORTS:=}"

# BBR
: "${MVN_BBR:=auto}"                    # auto | skip

# Services that may conflict with a fresh 3x-ui/Xray setup
CONFLICT_UNITS=("xray.service" "sing-box.service" "hysteria-server.service" "marzban.service" "v2ray.service")
