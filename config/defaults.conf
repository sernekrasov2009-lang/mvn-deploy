# MVN Deploy defaults. This file is sourced by Bash; keep values shell-safe.
PROJECT_NAME="MVN Deploy"
PROJECT_VERSION="0.2.0"

# Official upstream installer for 3x-ui. Xray-core is managed by 3x-ui.
XUI_INSTALL_URL="https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh"

# Requested panel TLS mode: ip uses a Let's Encrypt certificate for the public IP,
# supported by current upstream 3x-ui. Set MVN_XUI_SSL_MODE=none to override,
# but exposing a plaintext login to the public Internet is not recommended.
DEFAULT_XUI_SSL_MODE="ip"

# Baseline inbound ports. Custom inbound ports added later in 3x-ui must also be
# opened in the OS firewall and, if applicable, the VPS provider firewall.
DEFAULT_HTTP_PORT=80
DEFAULT_HTTPS_PORT=443
DEFAULT_HTTPS_UDP_PORT=443
BBR_SYSCTL_FILE="/etc/sysctl.d/99-mvn-deploy-bbr.conf"
